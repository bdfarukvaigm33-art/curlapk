
workflows:
  android-workflow:
    name: API Request Studio Android APK

    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Build Android Debug APK
        script: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      
